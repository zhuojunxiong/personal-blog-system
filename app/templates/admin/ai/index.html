{% extends "admin/base.html" %}

{% block title %}AI 占位{% endblock %}
{% block page_title %}AI 功能占位{% endblock %}

{% block content %}
  <section class="admin-panel">
    <p class="eyebrow">AI Extension Point</p>
    <h2>AI 功能将在后续版本开放</h2>
    <p class="text-secondary">
      V0.2 暂不接入任何真实 AI 接口，也不需要 API Key。当前仅保留摘要生成、标签推荐、文章润色和文章问答的服务函数占位。
    </p>
    <div class="d-flex gap-2 flex-wrap">
      <button class="btn btn-outline-secondary" disabled>AI 生成摘要</button>
      <button class="btn btn-outline-secondary" disabled>AI 推荐标签</button>
      <button class="btn btn-outline-secondary" disabled>AI 润色文章</button>
      <button class="btn btn-outline-secondary" disabled>AI 文章问答</button>
    </div>
  </section>
{% endblock %}
