{% extends "base.html" %}

{% block title %}管理员登录{% endblock %}

{% block content %}
  <section class="content-section">
    <div class="container login-container">
      <div class="login-panel">
        <p class="eyebrow">Admin Login</p>
        <h1>管理员登录</h1>
        <p class="text-secondary">请输入管理员账号进入后台。默认账号仅用于课程演示。</p>
        <form method="post" class="mt-4">
          <div class="mb-3">
            <label class="form-label">用户名</label>
            <input class="form-control form-control-lg" name="username" required autofocus>
          </div>
          <div class="mb-4">
            <label class="form-label">密码</label>
            <input class="form-control form-control-lg" name="password" type="password" required>
          </div>
          <button class="btn btn-dark btn-lg w-100" type="submit">登录</button>
        </form>
      </div>
    </div>
  </section>
{% endblock %}
