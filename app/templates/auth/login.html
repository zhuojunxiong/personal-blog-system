{% extends "base.html" %}

{% block title %}管理员登录{% endblock %}

{% block content %}
  <section class="content-section">
    <div class="container login-container">
      <div class="login-panel">
        <p class="eyebrow">Admin Login</p>
        <h1>{{ '管理员登录' if admin_only else '用户登录' }}</h1>
        <p class="text-secondary">{{ '请输入管理员账号进入后台。' if admin_only else '登录后可以写文章、创建专栏、评论、点赞和收藏。' }}</p>
        <form method="post" class="mt-4">
          <div class="mb-3">
            <label class="form-label">用户名</label>
            <input class="form-control form-control-lg" name="username" required autofocus>
          </div>
          <div class="mb-4">
            <label class="form-label">密码</label>
            <input class="form-control form-control-lg" name="password" type="password" required>
          </div>
          <button class="btn btn-dark btn-lg w-100" type="submit">登录</button>
        </form>
        {% if not admin_only %}
          <p class="mt-3 text-center text-secondary">还没有账号？<a href="{{ url_for('auth.register') }}">立即注册</a></p>
        {% endif %}
      </div>
    </div>
  </section>
{% endblock %}
