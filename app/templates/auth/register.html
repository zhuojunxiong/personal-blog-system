{% extends "base.html" %}

{% block title %}注册 - 知识专栏{% endblock %}

{% block content %}
  <section class="auth-section">
    <div class="container auth-layout">
      <div class="auth-copy">
        <p class="eyebrow">Join Platform</p>
        <h1>创建你的专属知识空间</h1>
        <p>加入以后，开始创建自己的专栏，发布属于你的文章，把课程实践、项目经验和阅读思考沉淀下来。</p>
        <div class="auth-art-board" aria-hidden="true">
          <div class="visual-toolbar">
            <span></span>
            <span></span>
            <span></span>
          </div>
          <div class="auth-figure">
            <span class="auth-figure-person thumb-4"></span>
            <span class="auth-figure-lines"><span></span><span></span><span></span></span>
          </div>
        </div>
      </div>

      <div class="auth-card">
        <p class="eyebrow">Create Account</p>
        <h2>注册账号</h2>
        <p class="muted">普通用户也可以拥有自己的专栏和文章主页。</p>
        <form method="post">
          <div class="mb-3">
            <label class="form-label">用户名</label>
            <input class="form-control" name="username" required maxlength="64" placeholder="请输入用户名">
          </div>
          <div class="mb-3">
            <label class="form-label">昵称</label>
            <input class="form-control" name="nickname" maxlength="64" placeholder="展示给读者的名字">
          </div>
          <div class="mb-3">
            <label class="form-label">邮箱</label>
            <input class="form-control" name="email" type="email" required maxlength="120" placeholder="name@example.com">
          </div>
          <div class="mb-3">
            <label class="form-label">密码</label>
            <input class="form-control" name="password" type="password" required minlength="6" placeholder="至少 6 位">
          </div>
          <p class="muted small">注册即表示同意平台的基础使用规则，当前版本仅保留提示占位。</p>
          <button class="btn btn-primary btn-lg w-100" type="submit">注册并登录</button>
        </form>
        <p class="auth-note">已有账号？<a class="clean-link" href="{{ url_for('auth.login') }}">立即登录</a></p>
      </div>
    </div>
  </section>
{% endblock %}
