{% extends "base.html" %}

{% block title %}用户注册{% endblock %}

{% block content %}
  <section class="content-section">
    <div class="container login-container">
      <div class="login-panel">
        <p class="eyebrow">Join Platform</p>
        <h1>注册创作者账号</h1>
        <p class="text-secondary">注册后可以创建自己的知识专栏并发布文章。</p>
        <form method="post" class="mt-4">
          <div class="mb-3">
            <label class="form-label">用户名</label>
            <input class="form-control form-control-lg" name="username" required maxlength="64">
          </div>
          <div class="mb-3">
            <label class="form-label">昵称</label>
            <input class="form-control form-control-lg" name="nickname" maxlength="64">
          </div>
          <div class="mb-3">
            <label class="form-label">邮箱</label>
            <input class="form-control form-control-lg" name="email" type="email" required maxlength="120">
          </div>
          <div class="mb-4">
            <label class="form-label">密码</label>
            <input class="form-control form-control-lg" name="password" type="password" required minlength="6">
          </div>
          <button class="btn btn-dark btn-lg w-100" type="submit">注册并登录</button>
        </form>
      </div>
    </div>
  </section>
{% endblock %}
