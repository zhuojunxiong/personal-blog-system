{% extends "base.html" %}

{% block title %}稷下{% endblock %}
{% block site_nav %}{% endblock %}
{% block site_footer %}{% endblock %}

{% block content %}
  <div class="home-page">
    <header class="home-header">
      <a class="home-brand-mark" href="{{ url_for('public.home') }}" aria-label="稷下首页">
        <span class="brand-mark">知</span>
        <span>稷下</span>
      </a>
      <div class="home-header-actions">
        {% if current_user.is_authenticated %}
          <a class="home-login-button" href="{{ url_for('user.profile_home') }}" aria-label="进入个人空间">
            <span class="v041-avatar">{{ current_user.nickname[:1] }}</span>
            <span>{{ current_user.nickname }}</span>
          </a>
        {% else %}
          <a class="home-login-button" href="{{ url_for('auth.login') }}">
            <span>登录</span>
          </a>
        {% endif %}
      </div>
    </header>

    <section class="home-search-stage" aria-labelledby="home-search-title">
      <form class="home-search-box"
            action="{{ url_for('ai.smart_search') }}"
            method="post"
            data-v041-ai-search-form
            data-v041-ai-search-url="{{ url_for('ai.smart_search') }}">
        <input class="home-search-input" name="q" type="search"
               placeholder="请写出你想要获取的知识"
               autocomplete="off" data-v041-search-input>
        <input type="hidden" name="page" value="1">
        <input type="hidden" name="pageSize" value="5">
        <button class="home-search-submit" type="submit" data-v041-loading-label="AI 思考中…">
          <span class="home-search-icon" aria-hidden="true">⌕</span>
          <span>AI 搜索</span>
        </button>
      </form>
    </section>
  </div>
{% endblock %}
